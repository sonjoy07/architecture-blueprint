# ==============================================================================
# Production Deployments: API (NestJS) & Web (Next.js 15)
# Security: Hardened Non-Root, Read-Only Root Filesystem, CSI Secrets Integration
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. API Deployment (NestJS Modular Monolith)
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copilot-api
  namespace: default
  labels:
    app.kubernetes.io/name: copilot-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: enterprise-copilot
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: copilot-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: copilot-api
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: copilot-workload-identity-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: gcr.io/ENTERPRISE_GCP_PROJECT/copilot-api:v2.4.0
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: copilot-config
            - secretRef:
                name: copilot-app-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 2
          volumeMounts:
            # Secrets Store CSI Mount
            - name: secrets-store-inline
              mountPath: /mnt/secrets-store
              readOnly: true
            # Writable ephemeral volume for read-only root compatibility
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: copilot-gcp-secrets
        - name: tmp-volume
          emptyDir: {}

---
# ------------------------------------------------------------------------------
# 2. Web Deployment (Next.js 15 Standalone)
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copilot-web
  namespace: default
  labels:
    app.kubernetes.io/name: copilot-web
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: enterprise-copilot
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: copilot-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: copilot-web
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: gcr.io/ENTERPRISE_GCP_PROJECT/copilot-web:v2.4.0
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: copilot-config
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
