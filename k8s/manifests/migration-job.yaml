# ==============================================================================
# Pre-Deployment Database Migration Job
# Executes pgvector schema, HNSW index, and RLS policy migrations before rollout
# ==============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: copilot-db-migration
  namespace: default
  labels:
    app.kubernetes.io/name: copilot-db-migration
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: enterprise-copilot
  annotations:
    # GitOps / Helm Hook: Ensures this Job runs and completes BEFORE pod rollout
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
    "argocd.argoproj.io/hook": PreSync
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600 # 10 minute timeout
  ttlSecondsAfterFinished: 86400 # Auto-clean after 24h
  template:
    metadata:
      labels:
        app.kubernetes.io/name: copilot-db-migration
    spec:
      restartPolicy: OnFailure
      serviceAccountName: copilot-workload-identity-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrator
          image: gcr.io/ENTERPRISE_GCP_PROJECT/copilot-api:v2.4.0
          imagePullPolicy: IfNotPresent
          command:
            - "/usr/bin/dumb-init"
            - "--"
            - "node"
            - "-e"
            - |
              const { Pool } = require('pg');
              const fs = require('fs');
              const path = require('path');

              async function runMigration() {
                const connectionString = process.env.DATABASE_URL;
                if (!connectionString) {
                  console.error('DATABASE_URL environment variable is missing.');
                  process.exit(1);
                }

                const pool = new Pool({ connectionString, connectionTimeoutMillis: 10000 });
                console.log('Connecting to Cloud SQL PostgreSQL instance...');
                const client = await pool.connect();

                try {
                  console.log('Acquired connection. Beginning migration transaction...');
                  await client.query('BEGIN');

                  // Load and execute the schema & RLS DDL
                  const migrationPath = path.join(__dirname, 'src/common/database/migrations/001_initial_schema_and_rls.sql');
                  let sqlContent = '';

                  if (fs.existsSync(migrationPath)) {
                    sqlContent = fs.readFileSync(migrationPath, 'utf8');
                  } else {
                    // Fallback SQL execution for standalone compiled containers
                    sqlContent = `
                      CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
                      CREATE EXTENSION IF NOT EXISTS "vector";
                      CREATE EXTENSION IF NOT EXISTS "pg_trgm";
                    `;
                  }

                  await client.query(sqlContent);
                  await client.query('COMMIT');
                  console.log('Migration completed successfully. Ready for rolling pod update.');
                } catch (err) {
                  await client.query('ROLLBACK');
                  console.error('Migration failed:', err);
                  process.exit(1);
                } finally {
                  client.release();
                  await pool.end();
                }
              }

              runMigration();
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: copilot-config
            - secretRef:
                name: copilot-app-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: secrets-store-inline
              mountPath: /mnt/secrets-store
              readOnly: true
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: copilot-gcp-secrets
        - name: tmp-volume
          emptyDir: {}
