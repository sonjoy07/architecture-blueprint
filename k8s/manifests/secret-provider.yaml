apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: copilot-gcp-secrets
  namespace: default
  labels:
    app.kubernetes.io/name: enterprise-copilot
    app.kubernetes.io/part-of: copilot-platform
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/ENTERPRISE_GCP_PROJECT/secrets/copilot-prod-database-url/versions/latest"
        fileName: "DATABASE_URL"
      - resourceName: "projects/ENTERPRISE_GCP_PROJECT/secrets/copilot-prod-openai-api-key/versions/latest"
        fileName: "OPENAI_API_KEY"
      - resourceName: "projects/ENTERPRISE_GCP_PROJECT/secrets/copilot-prod-anthropic-api-key/versions/latest"
        fileName: "ANTHROPIC_API_KEY"
  secretObjects:
    - secretName: copilot-app-secrets
      type: Opaque
      data:
        - objectName: "DATABASE_URL"
          key: "DATABASE_URL"
        - objectName: "OPENAI_API_KEY"
          key: "OPENAI_API_KEY"
        - objectName: "ANTHROPIC_API_KEY"
          key: "ANTHROPIC_API_KEY"
