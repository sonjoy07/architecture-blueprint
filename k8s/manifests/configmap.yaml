apiVersion: v1
kind: ConfigMap
metadata:
  name: copilot-config
  namespace: default
  labels:
    app.kubernetes.io/name: enterprise-copilot
    app.kubernetes.io/part-of: copilot-platform
    environment: production
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "3000"
  DB_POOL_MAX: "30"
  DB_CONNECTION_TIMEOUT_MS: "5000"
  RAG_MAX_CONTEXT_TOKENS: "3500"
  RAG_HNSW_EF_SEARCH: "64"
  RAG_RRF_K: "60"
  GCS_DOCUMENTS_BUCKET: "enterprise-copilot-documents-prod"
  NEXT_PUBLIC_API_URL: "https://copilot.enterprise.internal"
