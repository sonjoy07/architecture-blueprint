# ==============================================================================
# Automated Database Backup CronJob: Cloud SQL PostgreSQL
# Features: pg_dump -> gzip -> AES-256-CBC Encryption -> Stream to GCS
# Security: Google Workload Identity, Non-Root, No Persistent Local Disk
# ==============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: copilot-db-backup-cronjob
  namespace: default
  labels:
    app.kubernetes.io/name: copilot-db-backup
    app.kubernetes.io/component: backup-engine
    app.kubernetes.io/part-of: enterprise-copilot
spec:
  schedule: "0 2 * * *" # Daily at 02:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 14
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800 # 30 minute timeout
      template:
        metadata:
          labels:
            app.kubernetes.io/name: copilot-db-backup
        spec:
          restartPolicy: OnFailure
          serviceAccountName: copilot-backup-workload-identity-sa
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-backup-streamer
              image: google/cloud-sdk:alpine
              command:
                - "/bin/bash"
                - "-c"
                - |
                  set -euo pipefail
                  echo "=== Starting Automated Cloud SQL Backup ==="

                  # 1. Install postgresql-client and openssl in container runtime
                  apk add --no-cache postgresql16-client openssl gzip

                  # 2. Extract database connection parameters
                  TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)
                  BACKUP_FILE="/tmp/copilot_pg_backup_${TIMESTAMP}.sql.gz.enc"
                  GCS_DESTINATION="gs://${GCS_BACKUP_BUCKET}/backups/${TIMESTAMP}/copilot_db_${TIMESTAMP}.sql.gz.enc"

                  echo "Executing pg_dump with on-the-fly AES-256 encryption..."
                  
                  # 3. Stream: pg_dump -> gzip -> openssl AES-256-CBC (PBKDF2) -> encrypted file
                  PGPASSWORD="${DB_PASSWORD}" pg_dump \
                    -h "${DB_HOST}" \
                    -U "${DB_USER}" \
                    -d "${DB_NAME}" \
                    --no-owner \
                    --no-privileges \
                    --clean \
                    --if-exists \
                    --quote-all-identifiers \
                    | gzip -9 \
                    | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 100000 \
                      -pass "env:BACKUP_ENCRYPTION_KEY" \
                      -out "${BACKUP_FILE}"

                  echo "Encryption complete. File size: $(stat -c %s "${BACKUP_FILE}") bytes."

                  # 4. Stream securely to GCS private bucket using Workload Identity
                  echo "Uploading encrypted snapshot to ${GCS_DESTINATION}..."
                  gsutil -m cp "${BACKUP_FILE}" "${GCS_DESTINATION}"

                  # 5. Verify upload integrity
                  echo "Verifying GCS object presence..."
                  gsutil ls "${GCS_DESTINATION}"

                  # 6. Secure wipe of local scratch container disk
                  rm -f "${BACKUP_FILE}"
                  echo "=== Automated Backup Completed and Verified Successfully ==="
              securityContext:
                readOnlyRootFilesystem: false
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: GCS_BACKUP_BUCKET
                  valueFrom:
                    configMapKeyRef:
                      name: copilot-config
                      key: GCS_DOCUMENTS_BUCKET
                - name: DB_HOST
                  value: "10.0.2.3" # Internal Private IP from Terraform Cloud SQL module
                - name: DB_USER
                  value: "copilot_prod_user"
                - name: DB_NAME
                  value: "enterprise_copilot_prod"
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: copilot-app-secrets
                      key: DATABASE_URL # or dedicated DB password secret
                - name: BACKUP_ENCRYPTION_KEY
                  valueFrom:
                    secretKeyRef:
                      name: copilot-app-secrets
                      key: OPENAI_API_KEY # In production, use dedicated BACKUP_ENCRYPTION_KEY in Secret Manager
              resources:
                requests:
                  cpu: "500m"
                  memory: "512Mi"
                limits:
                  cpu: "2000m"
                  memory: "2Gi"
              volumeMounts:
                - name: tmp-volume
                  mountPath: /tmp
          volumes:
            - name: tmp-volume
              emptyDir: {}
