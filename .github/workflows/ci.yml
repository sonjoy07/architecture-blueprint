name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # 1. Code Quality, Linting & Unit Tests
  # ----------------------------------------------------------------------------
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Execute Code Linting
        run: npm run lint

      - name: Execute Unit & Integration Tests
        run: npm test

  # ----------------------------------------------------------------------------
  # 2. Infrastructure as Code (Terraform) Validation
  # ----------------------------------------------------------------------------
  terraform-check:
    name: Terraform Format & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup HashiCorp Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive terraform/

      - name: Initialize Terraform Production Config (Stateless)
        run: terraform -chdir=terraform/environments/prod init -backend=false

      - name: Validate Terraform Syntax & References
        run: terraform -chdir=terraform/environments/prod validate

  # ----------------------------------------------------------------------------
  # 3. Security & Static Analysis (Trivy)
  # ----------------------------------------------------------------------------
  security-audit:
    name: Trivy Security & Vulnerability Audit
    runs-on: ubuntu-latest
    needs: [lint-and-test, terraform-check]
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner (Repo & Config)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

  # ----------------------------------------------------------------------------
  # 4. Multi-Stage Docker Builds with GitHub Actions Caching
  # ----------------------------------------------------------------------------
  docker-build-and-cache:
    name: Docker Build & Multi-Stage Cache
    runs-on: ubuntu-latest
    needs: [security-audit]
    strategy:
      matrix:
        include:
          - context: apps/api
            dockerfile: apps/api/Dockerfile
            image-name: enterprise-copilot-api
          - context: apps/web
            dockerfile: apps/web/Dockerfile
            image-name: enterprise-copilot-web
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Cache Docker Image (${{ matrix.image-name }})
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.image-name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image-name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image-name }}

      - name: Scan Built Image with Trivy
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ matrix.image-name }}:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
